site_name: Furunin Sacc Extensions
site_description: SaccFlightAndVehicles向け拡張ギミックの利用者向けドキュメント
site_url: https://furunin.github.io/FuruninSaccExtensions-Docs/
repo_url: https://github.com/furunin/FuruninSaccExtensions-Docs
repo_name: furunin/FuruninSaccExtensions-Docs
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      primary: indigo
      scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークテーマに切り替える
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトテーマに切り替える

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/fov-calculator.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  version:
    provider: mike
    default: latest
    alias: true

nav:
  - ホーム:
      - ギミック概要: index.md
  - FSE Guided Missiles:
      - 概要: guided-missiles/index.md
      - 導入・基本設定:
          - 共通セットアップ: guided-missiles/installation.md
          - 誘導方式別導入:
              - MCLOS: guided-missiles/mclos.md
              - SACLOS: guided-missiles/saclos.md
          - 基本的な設定: guided-missiles/basic-settings.md
          - 任意機能の導入: guided-missiles/optional-features.md
          - 設定項目一覧: guided-missiles/components.md
      - 操作方法: guided-missiles/operation.md
      - ミサイルの動作: guided-missiles/behavior.md
      - トラブルシューティング: guided-missiles/troubleshooting.md
  - FSE Turret Control:
      - 概要: turret-control/index.md
      - 導入・基本設定:
          - セットアップ: turret-control/installation.md
          - 基本的な設定: turret-control/basic-settings.md
          - 設定項目一覧: turret-control/components.md
      - 操作方法: turret-control/operation.md
      - トラブルシューティング: turret-control/troubleshooting.md
  - 共通情報:
      - ライセンスとクレジット: common/license.md
      - 文書更新履歴: common/changelog.md
